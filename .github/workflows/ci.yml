name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongo-test-${{ runner.os }}-8
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile workflows
        run: npm run e2e -w frontend
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t taskflow/backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t taskflow/frontend:ci .
