name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v5
        with:
          path: .cache/mongodb-binaries
          key: mongo-test-${{ runner.os }}-8
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile workflows
        run: npm run e2e -w frontend
  compose:
    needs: check
    # Temporary MongoDB 8/kernel workaround: SERVER-121912 and SERVER-136848.
    # Revisit before the Ubuntu 22.04 runner retires on 2027-04-17.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Record Docker platform
        run: |
          uname -r
          docker info --format '{{.KernelVersion}}'
          docker compose version
      - run: npm ci
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t taskflow/backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t taskflow/frontend:ci .
      - name: Verify Compose development rollout and persistence
        run: npm run verify:compose -w backend
      - name: Verify production artifacts with isolated Compose
        run: npm run verify:compose -w backend -- --production
